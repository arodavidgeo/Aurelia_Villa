<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Progressive Enhancement: Add .js class to documentElement immediately -->
    <script>document.documentElement.classList.add('js');</script>
    
    <!-- Anti-flash theme initialization script -->
    <script>
      (function() {
        try {
          var urlParams = new URLSearchParams(window.location.search);
          var paramTheme = urlParams.get('theme');
          var saved = localStorage.getItem('va_theme');
          var theme = paramTheme || saved || 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- SEO Meta Tags -->
    <title>Villa Aurelia — A Private Villa Stay in Tirunelveli | ₹7,500 Exclusive Stay</title>
    <meta name="description" content="Villa Aurelia: An entire private house in Tirunelveli for ₹7,500 per 24 hours. Two AC bedrooms, common living hall, kitchen, parking for 2 cars & 4 bikes, and terrace for gatherings." />
    <meta name="keywords" content="Villa Aurelia, private villa stay in Tirunelveli, entire house stay in Tirunelveli, family villa stay, terrace celebration venue in Tirunelveli, villa rental Tirunelveli" />
    <link rel="canonical" href="https://villaaurelia.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://villaaurelia.com" />
    <meta property="og:title" content="Villa Aurelia — Your Space. Your Moments. Your Villa." />
    <meta property="og:description" content="Experience the comfort of an entire private home in Tirunelveli. ₹7,500 for a 24-hour exclusive stay. Two AC bedrooms, hall, kitchen, parking, and terrace." />
    <meta property="og:image" content="/images/villa/villa-aurelia-exterior-01.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Villa Aurelia — Your Space. Your Moments. Your Villa." />
    <meta name="twitter:description" content="An entire private home in Tirunelveli for family stays and celebrations. ₹7,500 / 24 hours exclusive stay." />
    <meta name="twitter:image" content="/images/villa/villa-aurelia-exterior-01.jpg" />

    <!-- Google Fonts: Cormorant Garamond & DM Sans -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"

      "logo": "https://villaaurelia.com/logo/villa-aurelia-logo.png",
      "image": "https://villaaurelia.com/images/villa/villa-aurelia-exterior-01.jpg",
      "telephone": "+919629668800",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "H-18, TNHB Colony, Stage - 1, Bharani Nagar, VM Chatram",
        "addressLocality": "Tirunelveli",
        "postalCode": "627011",
        "addressRegion": "Tamil Nadu",
        "addressCountry": "IN"
      },
      "makesOffer": {
        "@type": "Offer",
        "price": "7500",
        "priceCurrency": "INR",
        "description": "24-hour exclusive stay for the entire private villa"
      },
      "amenityFeature": [
        { "@type": "LocationFeatureSpecification", "name": "Air Conditioning", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Private Parking for 2 Cars and 4 Bikes", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Guest Kitchen", "value": true },

        { "@type": "LocationFeatureSpecification", "name": "Common Living Hall", "value": true }
      ]
    }
    </script>
  </head>
  <body class="bg-theme-bg text-theme-text-primary font-sans antialiased selection:bg-theme-accent selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
