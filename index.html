<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Anti-flash theme initialization script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('va_theme');
          var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- SEO Meta Tags -->
    <title>Villa Aurelia — A Boutique Villa Stay | Serenity, Comfort, Memories</title>
    <meta name="description" content="A boutique villa stay featuring thoughtfully appointed rooms, unhurried mornings, curated local experiences, and personalised hospitality in a peaceful setting." />
    <meta name="keywords" content="Villa Aurelia, luxury boutique villa, boutique stay, luxury accommodation, holiday villa, peaceful retreat, private villa stay" />
    <link rel="canonical" href="https://villaaurelia.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://villaaurelia.com" />
    <meta property="og:title" content="Villa Aurelia — A Boutique Villa Stay" />
    <meta property="og:description" content="A quieter kind of luxury. Thoughtfully appointed rooms, unhurried mornings, and a stay that feels entirely your own." />
    <meta property="og:image" content="/images/hero-courtyard.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Villa Aurelia — A Boutique Villa Stay" />
    <meta name="twitter:description" content="A quieter kind of luxury. Thoughtfully appointed rooms, unhurried mornings, and a stay that feels entirely your own." />
    <meta name="twitter:image" content="/images/hero-courtyard.png" />

    <!-- Google Fonts: Cormorant Garamond & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data: LodgingBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LodgingBusiness",
      "name": "Villa Aurelia",
      "description": "A boutique villa retreat offering peaceful, nature-connected accommodation with personalized hospitality.",
      "url": "https://villaaurelia.com",
      "telephone": "+91 98765 43210",
      "email": "info@villaaurelia.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "123 Villa Aurelia",
        "addressLocality": "Coastal Haven",
        "addressRegion": "Tamil Nadu",
        "addressCountry": "IN"
      },
      "priceRange": "₹4,500 - ₹8,500",
      "checkinTime": "14:00",
      "checkoutTime": "11:00",
      "petsAllowed": false,
      "amenityFeature": [
        { "@type": "LocationFeatureSpecification", "name": "Swimming Pool", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Free High-Speed Wi-Fi", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Curated Dining", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Private Parking", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Lush Tropical Gardens", "value": true },
        { "@type": "LocationFeatureSpecification", "name": "Air Conditioning", "value": true }
      ]
    }
    </script>
  </head>
  <body class="bg-theme-bg text-theme-text-primary font-sans antialiased selection:bg-theme-accent selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
